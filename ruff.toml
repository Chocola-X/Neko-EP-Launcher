target-version = "py310"
line-length = 100

[lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes / warnings
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",   # 行长由 formatter 控制
    "B008",   # 函数默认值构造（Qt 信号常用）
    "SIM108", # 三元替代 if-else，可读性
    "RUF001", # 中文全角标点误报
    "RUF002", # 中文全角标点误报
    "RUF003", # 中文全角标点误报
]

[lint.isort]
known-first-party = ["src"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
