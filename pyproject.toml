[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energyplus-launcher"
version = "0.5.0"
description = "Linux 桌面端 EnergyPlus 图形化启动工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "华为云码道(CodeArts)" }]
dependencies = [
    "PySide6>=6.4.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.scripts]
energyplus-launcher = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "e2e: 端到端测试（真跑 EnergyPlus，默认跳过）",
]
testpaths = ["tests"]
qt_api = "pyside6"
